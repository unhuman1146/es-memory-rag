name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 参考引擎测试（39 项）
        run: python scripts/test_memory_engine.py
      - name: 上下文预算测试（17 项）
        run: python scripts/test_context_budget.py
